
stages:
  train:
    cmd: python main.py
    deps:
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
      - src/data_loader.py
      - src/preprocessing.py
      - src/feature_engineering.py
      - src/feature_selection.py
      - src/train.py
      - main.py
    params:
      - params.yaml:
          - version
          - random_state
          - test_size
          - kernel
          - C
          - gamma
          - degree
          - lasso_alpha
    outs:
      - artifacts/svm_bundle.joblib
      - artifacts/metrics.csv
